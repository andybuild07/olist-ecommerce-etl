name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: olist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest psycopg2-binary

      - name: Initialize Star Schema tables in test Postgres
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -p 5432 -U ci_user -d olist_test <<'EOF'
          CREATE TABLE IF NOT EXISTS public.dim_customers (
              customer_id TEXT PRIMARY KEY,
              customer_unique_id TEXT,
              customer_zip_code_prefix TEXT,
              customer_city TEXT,
              customer_state TEXT
          );

          CREATE TABLE IF NOT EXISTS public.dim_products (
              product_id TEXT PRIMARY KEY,
              product_category_name TEXT,
              product_name_lenght INTEGER,
              product_description_lenght INTEGER,
              product_photos_qty INTEGER,
              product_weight_g NUMERIC,
              product_length_cm NUMERIC,
              product_height_cm NUMERIC,
              product_width_cm NUMERIC
          );

          CREATE TABLE IF NOT EXISTS public.dim_sellers (
              seller_id TEXT PRIMARY KEY,
              seller_zip_code_prefix TEXT,
              seller_city TEXT,
              seller_state TEXT
          );

          CREATE TABLE IF NOT EXISTS public.fact_order_items (
              order_id TEXT,
              order_item_id INTEGER,
              customer_id TEXT,
              product_id TEXT,
              seller_id TEXT,
              payment_type TEXT,
              payment_sequential INTEGER,
              payment_installments INTEGER,
              price NUMERIC,
              freight_value NUMERIC,
              payment_value NUMERIC,
              shipping_limit_date TEXT,
              order_purchase_timestamp TEXT,
              order_approved_at TEXT,
              order_delivered_carrier_date TEXT,
              order_delivered_customer_date TEXT,
              order_estimated_delivery_date TEXT,
              order_status TEXT,
              ds DATE
          );
          EOF

      - name: Run pytest suite
        env:
          TEST_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/olist_test
        run: pytest tests